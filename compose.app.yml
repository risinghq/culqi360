x-app: &app
  image: crm-app-${DEPLOYMENT_NAME:?Set DEPLOYMENT_NAME}:latest
  build:
    context: .
    dockerfile: Dockerfile
    args:
      SENTRY_ORG: ${SENTRY_ORG:-}
      SENTRY_PROJECT: ${SENTRY_PROJECT:-}
      SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
  restart: unless-stopped
  env_file:
    - .env
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: 3000
    WEB_DATA_DIR: /var/lib/crm-web/data
    ENGINE_CONNECT_MODE: internal
    ENGINE_URL: http://crm-engine:3001
    WEB_UPLOADS_ROOT: /var/lib/crm-web/documents
  volumes:
    - ${APP_DATA_PATH:?Set APP_DATA_PATH}/uploads:/var/lib/crm-web
  networks:
    - default
    - dokploy-network

services:
  prepare:
    image: crm-app-${DEPLOYMENT_NAME:?Set DEPLOYMENT_NAME}:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
    restart: "no"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      WEB_DATA_DIR: /var/lib/crm-web/data
    volumes:
      - ${APP_DATA_PATH:?Set APP_DATA_PATH}/uploads:/var/lib/crm-web
    command: ["bun", "run", "provision:prod"]

  web:
    <<: *app
    expose:
      - "3000"
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.crm-${DEPLOYMENT_NAME:?Set DEPLOYMENT_NAME}.entrypoints=web
      - traefik.http.routers.crm-${DEPLOYMENT_NAME:?Set DEPLOYMENT_NAME}.rule=Host(`${APP_DOMAIN:?Set APP_DOMAIN}`)
      - traefik.http.services.crm-${DEPLOYMENT_NAME:?Set DEPLOYMENT_NAME}.loadbalancer.server.port=3000
    depends_on:
      prepare:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - >-
          const response = await fetch("http://127.0.0.1:3000/");
          if (response.status >= 500) process.exit(1);
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  dokploy-network:
    external: true
    name: dokploy-network
