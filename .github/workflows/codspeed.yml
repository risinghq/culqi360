name: CodSpeed

on:
  push:
    branches:
      - "master"
    paths:
      - "apps/web/src/domain/**"
      - "apps/web/src/lib/**"
      - "apps/web/src/server/**"
      - "apps/web/tests/bench/**"
      - "apps/web/vitest.bench.config.ts"
      - "apps/web/package.json"
      - "packages/email-composer/src/**"
      - "packages/email-composer/package.json"
      - "packages/message-channels/src/**"
      - "packages/message-channels/package.json"
      - "bun.lock"
      - ".github/workflows/codspeed.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "apps/web/src/domain/**"
      - "apps/web/src/lib/**"
      - "apps/web/src/server/**"
      - "apps/web/tests/bench/**"
      - "apps/web/vitest.bench.config.ts"
      - "apps/web/package.json"
      - "packages/email-composer/src/**"
      - "packages/email-composer/package.json"
      - "packages/message-channels/src/**"
      - "packages/message-channels/package.json"
      - "bun.lock"
      - ".github/workflows/codspeed.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: install dependencies
        run: mise run install

      - name: run benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          run: mise run test:perf
